<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kaynak PDF sayfası · TUS Spot</title>
<style>
body{margin:0;background:#eef1ed;color:#20382e;font:16px system-ui,sans-serif}header{position:sticky;top:0;z-index:1;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;padding:10px;background:#fff;border-bottom:1px solid #ccd5cc}button,a{font:inherit;color:inherit}button{padding:6px 14px;border:1px solid #b8c7ba;background:white;border-radius:6px;cursor:pointer}#pages{padding:12px;text-align:center;overflow:auto}canvas{display:block;margin:auto;max-width:none;box-shadow:0 2px 10px #0002;background:white}#status{padding:12px;text-align:center}#status:empty{display:none}
</style>
</head>
<body>
<header><span id="pageLabel" role="status">PDF yükleniyor…</span><button id="zoomOut" aria-label="Uzaklaştır">−</button><button id="zoomIn" aria-label="Yakınlaştır">+</button><a id="download" download>PDF indir</a></header>
<p id="status" role="alert"></p><main id="pages"><canvas id="page" aria-label="Kaynak PDF sayfası"></canvas></main>
<script type="module" src="pdf-viewer.js"></script>
</body>
</html>
